services:
  ollama:
    image: ollama/ollama:latest
    container_name: big-bear-ollama-cpu
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chroma:
    image: chromadb/chroma:latest
    container_name: rag-chroma-db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /mnt/data/chroma_data:/data
    environment:
      - ALLOW_RESET=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  rag-api:
    build: ./rag-api
    image: local-rag-rag-api:latest
    container_name: rag-fastapi
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - CHROMA_HOST=${CHROMA_HOST}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped

  rag-mcp-http:
    build: ./rag-api
    image: local-rag-rag-mcp-http:latest
    container_name: rag-mcp-http
    ports:
      - "8082:8082"
    volumes:
      - ./rag-api:/app
    restart: unless-stopped
    command: python mcp-server.py
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8082
    depends_on:
      - rag-api

volumes:
  ollama_data:
